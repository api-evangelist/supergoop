apis:
- name: Supergoop! UCP Shopping MCP Server
  description: >-
    A live remote Model Context Protocol server implementing the Universal
    Commerce Protocol dev.ucp.shopping service for the Supergoop! store. An
    anonymous tools/list returns 13 tools with full JSON Schema inputSchemas
    covering catalog search and lookup, cart, checkout and order retrieval.
    Catalog and cart calls require a fetchable UCP agent profile URI; order calls
    require a JWT; completing a checkout requires an idempotency key and explicit
    human payment approval.
  humanURL: https://supergoop.com/agents.md
  baseURL: https://supergoop.com/api/ucp/mcp
  tags:
  - MCP
  - Agentic Commerce
  - Universal Commerce Protocol
  - Shopping
  - Checkout
  properties:
  - type: Documentation
    url: https://supergoop.com/agents.md
- name: Supergoop! Storefront GraphQL API
  description: >-
    The Shopify Storefront GraphQL API as served for supergoop.com. Introspection
    is open and anonymous, returning 428 types, 34 root query fields and 41
    mutations covering products, collections, search, blogs, pages, menus,
    localization, cart lifecycle and customer accounts. Query cost is returned
    inline on every response as extensions.cost.
  humanURL: https://supergoop.com/agents.md
  baseURL: https://supergoop.com/api/2026-07/graphql.json
  tags:
  - GraphQL
  - Catalog
  - Product
  - Cart
  - E-Commerce
  tags_raw:
  - GraphQL
  - Catalog
  - Products
  - Cart
  - E-Commerce
  properties:
  - type: GraphQL
    url: graphql/supergoop-storefront-2026-07.graphql
