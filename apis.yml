aid: supergoop
name: Supergoop!
description: >-
  Supergoop! is a prestige suncare brand founded in 2005 by Holly Thaggard and
  headquartered in San Antonio, Texas, selling SPF-first skincare, body, makeup
  and kids products direct-to-consumer at supergoop.com and through retail
  partners; Blackstone Growth took a majority stake in 2021 at a reported $600-700
  million valuation. It is not a software company and runs no developer program,
  but its Shopify storefront exposes three live, anonymous machine surfaces on its
  own domain: a Universal Commerce Protocol (UCP) shopping MCP server at
  /api/ucp/mcp with 13 tools, a fully introspectable Storefront GraphQL API at
  /api/2026-07/graphql.json with 428 types, and agent-facing instructions at
  /agents.md and /llms.txt that publish the discovery paths, the six-step agent
  purchase flow and a hard human-approval rule on payment.
