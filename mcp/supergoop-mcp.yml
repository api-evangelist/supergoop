generated: '2026-08-29'
method: probed
source: https://supergoop.com/api/ucp/mcp
name: Supergoop! UCP Shopping MCP Server
description: >-
  Supergoop! serves a live, remote Model Context Protocol server at
  https://supergoop.com/api/ucp/mcp implementing the Universal Commerce Protocol
  (UCP) shopping service. An anonymous tools/list POST returned HTTP 200 with 13
  tools and full JSON Schema draft 2020-12 inputSchemas; the verbatim response is
  saved to mcp/supergoop-ucp-mcp-tools-list.json.
status: live
deployment:
  mode: remote
  endpoint: https://supergoop.com/api/ucp/mcp
  auth: unknown
  verified: probed
  note: >-
    tools/list is anonymous. Tool CALLS are tiered: catalog tools require a
    fetchable UCP agent profile URI passed in meta['ucp-agent'].profile (a
    -32001 profile_unreachable error is returned when it cannot be fetched), and
    order/customer tools require a JWT (-32000 AuthenticationRequired, HTTP 403,
    pointing at https://shopify.dev/docs/agents/get-started/authentication).
    There is no api-key path and no OAuth challenge on the MCP endpoint itself,
    so 'unknown' is the honest value rather than none/oauth/api-key.
alternate_endpoints:
  - url: https://supergoop.myshopify.com/api/ucp/mcp
    source: https://supergoop.com/.well-known/ucp (services['dev.ucp.shopping'][0].endpoint)
discovery:
  - {path: /llms.txt, url: 'https://supergoop.com/llms.txt', status: 200}
  - {path: /agents.md, url: 'https://supergoop.com/agents.md', status: 200}
  - {path: /robots.txt, url: 'https://supergoop.com/robots.txt', status: 200, note: names the UCP and MCP endpoints in comments}
  - {path: /.well-known/ucp, url: 'https://supergoop.com/.well-known/ucp', status: 200}
  - {path: /sitemap_agentic_discovery.xml, url: 'https://supergoop.com/sitemap_agentic_discovery.xml', status: 200, note: a dedicated agent-discovery sitemap containing only /agents.md}
protocol:
  name: Universal Commerce Protocol (UCP)
  spec: https://ucp.dev
  transport: mcp
  api_version_header: x-shopify-ucp-mcp-api-version
  negotiated_version: '2026-08-25'
  supported_versions: ['2026-08-25', '2026-04-08', '2026-01-23']
  service: dev.ucp.shopping
  schema: https://ucp.dev/2026-08-25/services/shopping/mcp.openrpc.json
  capabilities:
    - dev.ucp.shopping.cart
    - dev.ucp.shopping.checkout
    - dev.ucp.shopping.fulfillment
    - dev.ucp.shopping.discount
    - dev.ucp.shopping.order
    - dev.ucp.shopping.catalog.search
    - dev.ucp.shopping.catalog.lookup
    - dev.shopify.catalog
  payment_handlers:
    - com.google.pay
tools_source: mcp/supergoop-ucp-mcp-tools-list.json
tool_count: 13
tools:
  - name: search_catalog
    category: catalog
    summary: 'Natural-language and filtered product search over the Supergoop! catalog; cursor paginated; conforms to dev.ucp.shopping.catalog.search.'
    description: "Search for products from the online store, hosted on Shopify.\n\nThis tool can be used to search for products using natural language queries, specific filter criteria, or both.\nAt least one of query or filters must be provided.\n\nResults are paginated, with initial results limited to improve experience.\nUse the pagination.cursor from the response to fetch additional pages when users request more results.\n\nResponse conforms to the UCP catalog search capability (dev.ucp.shopping.catalog.search).\n\nPrices in the response are integers in the currency's ISO 4217 minor units, paired with\na currency code: {\"amount\": 600, \"currency\": \"USD\"} is $6.00 and {\"amount\": 2500,\n\"currency\": \"USD\"} is $25.00. Convert to major units before quoting a price to a buyer\n(divide by 100 for two-decimal currencies such as USD and EUR; zero-decimal currencies\nsuch as JPY are already whole units).\n\n"
  - name: lookup_catalog
    category: catalog
    summary: 'Look up multiple products or variants by identifier.'
    description: "Look up multiple products or variants by identifier.\nUse this tool to resolve multiple product/variant IDs in a single request.\n\nSupports:\n- Product IDs (gid://shopify/Product/...): Returns product with match: \"featured\"\n- Variant IDs (gid://shopify/ProductVariant/...): Returns parent product with the exact variant\n\nResults are grouped by product. Each variant includes an inputs array showing\nwhich request ID resolved to it and whether the match was exact or featured.\n\nPrices in the response are integers in the currency's ISO 4217 minor units, paired with\na currency code: {\"amount\": 600, \"currency\": \"USD\"} is $6.00 and {\"amount\": 2500,\n\"currency\": \"USD\"} is $25.00. Convert to major units before quoting a price to a buyer\n(divide by 100 for two-decimal currencies such as USD and EUR; zero-decimal currencies\nsuch as JPY are already whole units).\n\n\nMaximum 10 IDs per request.\n"
  - name: get_product
    category: catalog
    summary: 'Retrieve complete product detail by identifier; returns a single product.'
    description: "Retrieve complete product detail by identifier. Returns a singular product\nwith a relevant set of variants, exact pricing, and real-time availability.\nSupports interactive option selection via selected and preferences parameters\nfor variant narrowing and availability signals. Use for product detail page\nrendering and purchase decisions.\n\nPrices in the response are integers in the currency's ISO 4217 minor units, paired with\na currency code: {\"amount\": 600, \"currency\": \"USD\"} is $6.00 and {\"amount\": 2500,\n\"currency\": \"USD\"} is $25.00. Convert to major units before quoting a price to a buyer\n(divide by 100 for two-decimal currencies such as USD and EUR; zero-decimal currencies\nsuch as JPY are already whole units).\n\n"
  - name: create_cart
    category: cart
    summary: 'Create a new cart.'
    description: "Creates a new cart\n\nPrices in the response are integers in the currency's ISO 4217 minor units, paired with\na currency code: {\"amount\": 600, \"currency\": \"USD\"} is $6.00 and {\"amount\": 2500,\n\"currency\": \"USD\"} is $25.00. Convert to major units before quoting a price to a buyer\n(divide by 100 for two-decimal currencies such as USD and EUR; zero-decimal currencies\nsuch as JPY are already whole units).\n\n"
  - name: get_cart
    category: cart
    summary: 'Get cart contents.'
    description: "Get the cart contents\n\nPrices in the response are integers in the currency's ISO 4217 minor units, paired with\na currency code: {\"amount\": 600, \"currency\": \"USD\"} is $6.00 and {\"amount\": 2500,\n\"currency\": \"USD\"} is $25.00. Convert to major units before quoting a price to a buyer\n(divide by 100 for two-decimal currencies such as USD and EUR; zero-decimal currencies\nsuch as JPY are already whole units).\n\n"
  - name: update_cart
    category: cart
    summary: 'Apply updates to a cart.'
    description: "Perform updates to a cart.\n\nPrices in the response are integers in the currency's ISO 4217 minor units, paired with\na currency code: {\"amount\": 600, \"currency\": \"USD\"} is $6.00 and {\"amount\": 2500,\n\"currency\": \"USD\"} is $25.00. Convert to major units before quoting a price to a buyer\n(divide by 100 for two-decimal currencies such as USD and EUR; zero-decimal currencies\nsuch as JPY are already whole units).\n\n"
  - name: cancel_cart
    category: cart
    summary: 'Cancel a cart.'
    description: "Cancels a cart.\n\nPrices in the response are integers in the currency's ISO 4217 minor units, paired with\na currency code: {\"amount\": 600, \"currency\": \"USD\"} is $6.00 and {\"amount\": 2500,\n\"currency\": \"USD\"} is $25.00. Convert to major units before quoting a price to a buyer\n(divide by 100 for two-decimal currencies such as USD and EUR; zero-decimal currencies\nsuch as JPY are already whole units).\n\n"
  - name: create_checkout
    category: checkout
    summary: 'Create a checkout; returns line items, totals, discounts and taxes.'
    description: "Creates a checkout. Returns checkout details, including line items, totals, and any applicable discounts or taxes.\n\nPrices in the response are integers in the currency's ISO 4217 minor units, paired with\na currency code: {\"amount\": 600, \"currency\": \"USD\"} is $6.00 and {\"amount\": 2500,\n\"currency\": \"USD\"} is $25.00. Convert to major units before quoting a price to a buyer\n(divide by 100 for two-decimal currencies such as USD and EUR; zero-decimal currencies\nsuch as JPY are already whole units).\n\n"
  - name: get_checkout
    category: checkout
    summary: 'Return checkout detail by id (gid://shopify/Checkout/...).'
    description: "Returns details about the checkout, including line items, totals, and any applicable discounts or taxes.\n\nPrices in the response are integers in the currency's ISO 4217 minor units, paired with\na currency code: {\"amount\": 600, \"currency\": \"USD\"} is $6.00 and {\"amount\": 2500,\n\"currency\": \"USD\"} is $25.00. Convert to major units before quoting a price to a buyer\n(divide by 100 for two-decimal currencies such as USD and EUR; zero-decimal currencies\nsuch as JPY are already whole units).\n\n"
  - name: update_checkout
    category: checkout
    summary: 'Update a checkout (shipping address, delivery method, buyer details).'
    description: "Updates a checkout. Returns checkout details, including line items, totals, and any applicable discounts or taxes.\n\nPrices in the response are integers in the currency's ISO 4217 minor units, paired with\na currency code: {\"amount\": 600, \"currency\": \"USD\"} is $6.00 and {\"amount\": 2500,\n\"currency\": \"USD\"} is $25.00. Convert to major units before quoting a price to a buyer\n(divide by 100 for two-decimal currencies such as USD and EUR; zero-decimal currencies\nsuch as JPY are already whole units).\n\n"
  - name: complete_checkout
    category: checkout
    summary: 'Complete a checkout and return the order id and Thank You Page URL. Requires meta[idempotency-key].'
    description: "Completes a checkout and returns the checkout result. Returns details about the completed checkout, including order ID, Thank You Page URL, or any errors encountered.\n\nPrices in the response are integers in the currency's ISO 4217 minor units, paired with\na currency code: {\"amount\": 600, \"currency\": \"USD\"} is $6.00 and {\"amount\": 2500,\n\"currency\": \"USD\"} is $25.00. Convert to major units before quoting a price to a buyer\n(divide by 100 for two-decimal currencies such as USD and EUR; zero-decimal currencies\nsuch as JPY are already whole units).\n\n"
  - name: cancel_checkout
    category: checkout
    summary: 'Cancel a checkout.'
    description: "Cancels a checkout.\n\nPrices in the response are integers in the currency's ISO 4217 minor units, paired with\na currency code: {\"amount\": 600, \"currency\": \"USD\"} is $6.00 and {\"amount\": 2500,\n\"currency\": \"USD\"} is $25.00. Convert to major units before quoting a price to a buyer\n(divide by 100 for two-decimal currencies such as USD and EUR; zero-decimal currencies\nsuch as JPY are already whole units).\n\n"
  - name: get_order
    category: order
    summary: 'Get order detail. JWT required (403 AuthenticationRequired when anonymous).'
    description: "Get the details of an order\n\nPrices in the response are integers in the currency's ISO 4217 minor units, paired with\na currency code: {\"amount\": 600, \"currency\": \"USD\"} is $6.00 and {\"amount\": 2500,\n\"currency\": \"USD\"} is $25.00. Convert to major units before quoting a price to a buyer\n(divide by 100 for two-decimal currencies such as USD and EUR; zero-decimal currencies\nsuch as JPY are already whole units).\n\n"

conventions_observed:
  money: >-
    Every price is an integer in ISO 4217 minor units paired with a currency code
    ({"amount": 2500, "currency": "USD"} is $25.00). Stated in every tool
    description.
  identifiers: Shopify global ids, e.g. gid://shopify/Checkout/abc123
  pagination: cursor, via pagination.cursor on catalog search responses
  idempotency: meta['idempotency-key'] is REQUIRED on complete_checkout
  human_in_the_loop: >-
    Both robots.txt and llms.txt state that checkout, payment and order placement
    must not be completed by an agent without explicit contemporaneous human
    approval.
