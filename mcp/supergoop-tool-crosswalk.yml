name: Supergoop! MCP <-> GraphQL tool crosswalk
description: >-
  Supergoop! publishes no OpenAPI, so the REST column of the standard crosswalk
  is empty. What it does publish is two overlapping-but-not-identical machine
  surfaces on the same store: the UCP shopping MCP server at
  /api/ucp/mcp (13 tools) and the Shopify Storefront GraphQL API at
  /api/2026-07/graphql.json (34 queries, 41 mutations). This file binds each MCP
  tool to the GraphQL field(s) that cover the same capability, and records what
  only one surface can do.
surfaces:
  openapi: none published
  graphql:
    endpoint: https://supergoop.com/api/2026-07/graphql.json
    gated: false
    note: introspection open and anonymous; customer-scoped fields need a customer access token
  mcp:
    endpoint: https://supergoop.com/api/ucp/mcp
    gated: partial
    note: >-
      tools/list anonymous; catalog calls require a fetchable UCP agent profile;
      order calls require a JWT
binding_note: >-
  Bindings are by capability and name semantics against the live schemas of both
  surfaces. No OpenAPI operationIds exist for this provider, so the `rest` column
  is empty on every row by fact, not by omission.
